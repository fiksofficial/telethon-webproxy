[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telethon-webproxy"
version = "0.1.0"
description = "Telegram WEB Proxy connector for Telethon (v1 & v2)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["telegram", "telethon", "proxy", "mtproto", "web-proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
]
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "cryptography>=39.0",
]

[project.optional-dependencies]
telethon-v1 = ["telethon>=1.28"]
telethon-v2 = ["telethon>=2.0"]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/user/telethon-webproxy"
Issues = "https://github.com/user/telethon-webproxy/issues"

[tool.setuptools.packages.find]
include = ["telethon_webproxy*"]
